<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>laya-onnx Snake</title>
<style>
html,body{margin:0;background:#070b12;color:#e2e8f0;font-family:system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px}h1{margin:6px 0 12px;font-size:26px}
.kicker{color:#34d399;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.pill{background:#1e293b;padding:6px 10px;border-radius:999px;font-size:13px}
canvas{display:block;width:100%;max-width:768px;height:auto;background:#020617;border:2px solid #34d399;border-radius:12px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button,select{padding:8px 12px;border:0;border-radius:8px;background:#334155;color:#fff}
#play{background:#34d399;color:#052e16;font-weight:700}#reason{color:#94a3b8;font-size:13px}
</style></head><body>
<div class="wrap">
<div class="kicker">laya-onnx</div><h1>Snake</h1>
<div class="bar"><span class="pill" id="score">score 0</span><span class="pill" id="len">len 6</span><span class="pill" id="policy">Laya mock</span></div>
<canvas id="c" width="768" height="512">Canvas requis</canvas>
<div class="row"><button id="play">Pause</button><button id="reset">Reset</button>
<select id="mode"><option value="laya">Laya mock</option><option value="cycle">Cycle</option><option value="human">Clavier</option></select>
<input id="fps" type="range" min="3" max="16" value="8"/><span id="reason">chargement</span></div>
</div>
<script>
(function(){
var W=24,H=16,CAP=W*H,CW=768,CH=512,CW0=CW/W,CH0=CH/H;
var canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
var DIRS={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]},NAMES=["UP","DOWN","LEFT","RIGHT"];
function ham(w,h){if(h%2)return ham(h,w).map(function(p){return[p[1],p[0]]});var p=[[0,0]],y,x;for(y=0;y<h;y++){if(y%2===0)for(x=1;x<w;x++)p.push([x,y]);else for(x=w-1;x>0;x--)p.push([x,y]);}for(y=h-1;y>0;y--)p.push([0,y]);return p;}
var cycle=ham(W,H),idx={};for(var i=0;i<cycle.length;i++)idx[cycle[i][0]+","+cycle[i][1]]=i;
function rng(s){return function(){var t=(s+=0x6d2b79f5);t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function Game(){this.rand=rng(7);var start=idx[Math.floor(W/2)+","+Math.floor(H/2)];this.body=[];for(var i=0;i<6;i++)this.body.push(cycle[(start-i+CAP)%CAP]);this.score=0;this.alive=true;this.food=this.spawn();}
Game.prototype.spawn=function(){var occ={},i,empty=[];for(i=0;i<this.body.length;i++)occ[this.body[i][0]+","+this.body[i][1]]=1;for(i=0;i<cycle.length;i++)if(!occ[cycle[i][0]+","+cycle[i][1]])empty.push(cycle[i]);return empty.length?empty[Math.floor(this.rand()*empty.length)]:null;};
Game.prototype.target=function(d){var v=DIRS[d];return[this.body[0][0]+v[0],this.body[0][1]+v[1]];};
Game.prototype.legal=function(d){var t=this.target(d),x=t[0],y=t[1],i;if(x<0||y<0||x>=W||y>=H)return"wall";if(this.body[1]&&this.body[1][0]===x&&this.body[1][1]===y)return"reverse";var occ={};for(i=0;i<this.body.length;i++)occ[this.body[i][0]+","+this.body[i][1]]=1;var eats=this.food&&this.food[0]===x&&this.food[1]===y;if(!eats){var tl=this.body[this.body.length-1];delete occ[tl[0]+","+tl[1]];}return occ[x+","+y]?"body":"legal";};
Game.prototype.step=function(d){if(!this.alive)return"dead";var why=this.legal(d);if(why!=="legal"){this.alive=false;return why;}var n=this.target(d);var eats=this.food&&n[0]===this.food[0]&&n[1]===this.food[1];this.body.unshift(n);if(eats){this.score++;this.food=this.spawn();}else this.body.pop();return eats?"eat":"ok";};
function cycleDir(g){var i=idx[g.body[0][0]+","+g.body[0][1]],n=cycle[(i+1)%CAP];var dx=n[0]-g.body[0][0],dy=n[1]-g.body[0][1];if(dx===1)return"RIGHT";if(dx===-1)return"LEFT";if(dy===1)return"DOWN";return"UP";}
function mock(g){var best=null,bd=99,i;for(i=0;i<4;i++){var d=NAMES[i];if(g.legal(d)!=="legal")continue;var t=g.target(d),dist=g.food?Math.abs(t[0]-g.food[0])+Math.abs(t[1]-g.food[1]):99;if(dist<bd){bd=dist;best=d;}}return best||cycleDir(g);}
function paint(){ctx.fillStyle="#020617";ctx.fillRect(0,0,CW,CH);ctx.strokeStyle="#1e293b";var x,y;for(x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*CW0,0);ctx.lineTo(x*CW0,CH);ctx.stroke();}for(y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*CH0);ctx.lineTo(CW,y*CH0);ctx.stroke();}if(game.food){ctx.fillStyle="#fbbf24";ctx.fillRect(game.food[0]*CW0+3,game.food[1]*CH0+3,CW0-6,CH0-6);}for(var i=game.body.length-1;i>=0;i--){var c=game.body[i];ctx.fillStyle=i===0?"#6ee7b7":"#059669";ctx.fillRect(c[0]*CW0+2,c[1]*CH0+2,CW0-4,CH0-4);}document.getElementById("score").textContent="score "+game.score;document.getElementById("len").textContent="len "+game.body.length;}
var game=new Game(),running=false,humanDir="RIGHT",timer=null;
function tick(){var mode=document.getElementById("mode").value;var dir=cycleDir(game);if(mode==="laya")dir=mock(game);if(mode==="human")dir=humanDir;var r=game.step(dir);document.getElementById("reason").textContent=game.alive?(dir+" · "+r):("mort · "+r);paint();if(!game.alive)stop();}
function start(){if(running)return;running=true;document.getElementById("play").textContent="Pause";timer=setInterval(tick,1000/Number(document.getElementById("fps").value));}
function stop(){running=false;document.getElementById("play").textContent="Play";clearInterval(timer);}
function reset(){stop();game=new Game();humanDir="RIGHT";paint();start();}
document.getElementById("play").onclick=function(){running?stop():start();};
document.getElementById("reset").onclick=reset;
document.getElementById("mode").onchange=function(){var m=this.value;document.getElementById("policy").textContent=m==="human"?"humain":m==="cycle"?"cycle":"Laya mock";};
document.getElementById("fps").onchange=function(){if(running){stop();start();}};
window.addEventListener("keydown",function(e){var map={ArrowUp:"UP",ArrowDown:"DOWN",ArrowLeft:"LEFT",ArrowRight:"RIGHT",w:"UP",s:"DOWN",a:"LEFT",d:"RIGHT"};if(map[e.key]){humanDir=map[e.key];e.preventDefault();}if(e.key===" "){running?stop():start();e.preventDefault();}if(e.key==="r"||e.key==="R")reset();});
paint();start();
})();
</script></body></html>
